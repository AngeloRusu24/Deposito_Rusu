<div class="settings">
  <h3>Impostazioni</h3>
  <label>Username</label>
  <input
    type="text"
    [value]="service.username()"
    (input)="service.setUsername($any($event.target).value)"
    placeholder="Il tuo nome"
  />
  <button (click)="service.toggleTema()">
    {{ service.temaScuro() ? 'Disattiva' : 'Attiva' }} tema scuro
  </button>
</div>
