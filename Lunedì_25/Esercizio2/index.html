<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Negozio Giocattoli - Inserimento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav>
            <a href="index.html">Inserisci</a>
            <a href="elenco.html">Elenco</a>
            <a href="riepilogo.html">Riepilogo</a>
        </nav>

        <h1> Inserisci un nuovo Giocattolo </h1>

        <form id="formGiocattolo">
            <div class="form-group">
                <label for="nome">Nome del Giocattolo:</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="form-group">
                <label for="categoria">Categoria:</label>
                <select id="categoria" name="categoria" required>
                    <option value="">Seleziona una categoria</option>
                    <option value="Bambole">Bambole</option>
                    <option value="Costruzioni">Costruzioni</option>
                    <option value="Veicoli">Veicoli</option>
                    <option value="Giochi da Tavolo">Giochi da Tavolo</option>
                    <option value="Elettronici">Elettronici</option>
                </select>
            </div>

            <div class="form-group">
                <label for="prezzo">Prezzo (€):</label>
                <input type="number" id="prezzo" name="prezzo" step="0.01" required>
            </div>

            <div class="form-group">
                <label for="eta"> Età Consigliata: </label>
                <input type="number" id="eta" name="eta" min="0" required>
            </div>

            <div class="form-group">
                <label for="disponibile">Giocattolo Disponibile:</label>
                <select id="disponibile" name="disponibile" required>
                    <option value="">Seleziona disponibilità</option>
                    <option value="true">Sì</option>
                    <option value="false">No</option>
                </select>
            </div>

            <button type="submit" id="btnSalva">Salva Giocattolo</button>

        </form>
    </div>

    <script src="script.js"></script>


</body>
</html>
